<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AR寄せ書き | 360°ギャラリー</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101729;color:white}button,input{font:inherit}button{cursor:pointer}.hide{display:none!important}.screen{min-height:100dvh;display:grid;place-items:center;padding:20px}.panel{width:min(440px,100%);padding:28px;border-radius:22px;background:#222d49}h1{font-size:26px}p{line-height:1.7;color:#dbe4f6}label{display:block;margin:20px 0 8px}input{width:100%;padding:14px;background:#0e1830;color:#fff;border:1px solid #7381a3;border-radius:10px}.primary{background:#c7f4e6;color:#10192b;border:0;padding:13px;border-radius:10px;font-weight:700;width:100%;margin-top:16px}.err{color:#ffc6c6}#arScreen{position:fixed;inset:0;background:#000;overflow:hidden}#arCanvas{width:100%;height:100%;display:block;touch-action:none}#cameraVideo{display:none}#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#hud span{background:#101a32c9;border-radius:12px;padding:9px;font-size:12px}#status{max-width:65%}#scanGuide{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;background:#0b152bc9;padding:22px;border-radius:20px;pointer-events:none;width:min(300px,85vw)}#countdown{font-size:72px;font-weight:800;line-height:1.1;color:#a7ffe3}#bottom{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;justify-content:center;gap:8px}#bottom button{background:#15213de9;border:1px solid #ffffff66;border-radius:12px;padding:12px;color:white}#orientationButton{background:#b5f6e4!important;color:#0b1d25!important;font-weight:bold}#detail{position:absolute;inset:0;background:#080d19d9;display:grid;place-items:center;padding:30px 20px;z-index:10}#detailPanel{max-width:min(86vw,480px);max-height:85dvh;display:grid;gap:10px;justify-items:center}#detailImage{max-width:100%;max-height:65dvh;object-fit:contain;border:6px solid #fff;border-radius:12px;box-shadow:0 12px 50px #000b}#detailClose{background:#c7f4e6;color:#10202c;border:0;border-radius:12px;padding:12px 24px;font-weight:bold}#detailEmpty{width:240px;height:320px;background:linear-gradient(#a2e4d7,#b5a4e9);border:6px solid white;border-radius:12px;display:grid;place-items:center;color:#1b2840}
</style></head><body>
<div id="login" class="screen"><div class="panel"><h1>AR寄せ書き</h1><p>パスワードを入力し、マーカーID 23を3秒間映すと、周囲360°に写真が広がります。</p><form id="passwordForm"><label for="password">閲覧パスワード</label><input id="password" type="password" required autocomplete="off"><button class="primary" type="submit">カメラを起動</button><p class="err" id="error" role="alert"></p></form><p style="font-size:12px">スマホのHTTPSサイトで利用してください。</p></div></div>
<div id="arScreen" class="hide"><video id="cameraVideo" autoplay muted playsinline></video><canvas id="arCanvas"></canvas><div id="hud"><span>AR寄せ書き · 360°</span><span id="status" aria-live="polite">準備中…</span></div><div id="scanGuide"><div>マーカーを3秒間映してください</div><div id="countdown">—</div><small>見失うとカウントがリセットされます</small></div><div id="bottom"><button id="orientationButton" class="hide">向きセンサーを有効化</button><button id="switchCamera">カメラ切替</button><button id="exitCamera">終了</button></div><div id="detail" class="hide"><div id="detailPanel"><div id="detailCounter"></div><img id="detailImage" class="hide" alt="拡大写真"><div id="detailEmpty" class="hide">デモ写真</div><button id="detailClose">戻る</button></div></div></div>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script><script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script><script src="dictionary.js"></script><script src="main.js"></script></body></html>
