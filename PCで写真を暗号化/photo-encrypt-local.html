<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR寄せ書き 写真暗号化ツール（PC用）</title>
<style>*{box-sizing:border-box}body{background:#10182d;color:#f5f6ff;font:16px system-ui,'Noto Sans JP',sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.7}h1{font-size:24px}label{display:block;margin-top:16px;font-weight:700}input,textarea{width:100%;font:inherit;padding:12px;margin-top:6px;border:1px solid #8e97b5;border-radius:9px;background:#252f4b;color:#fff}button{margin-top:20px;padding:15px 20px;border:0;border-radius:9px;background:#b5f3e1;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.note{background:#24314b;padding:15px;border-radius:10px}.error{color:#ffc6c6}code{background:#303e61;padding:2px 5px}</style></head><body>
<h1>AR寄せ書き：写真・文字の暗号化ツール</h1>
<p class="note">これはPC上で使用する管理用ページです。写真やパスワードは外部サーバーに送信しません。<b>このHTMLはGitHubへアップロード不要</b>です。完成した <code>content.enc.json</code> だけをGitHubに置いてください。</p>
<label>ARメッセージ（見出し）<input id="title" value="大学生活、ありがとう！" maxlength="45"></label>
<label>一言メッセージ<textarea id="message" rows="2" maxlength="70">たくさんの思い出を、これからも。</textarea></label>
<label>写真（最大8枚、JPEG / PNG / WebP）<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
<label>新しい閲覧パスワード（12文字以上を推奨）<input id="password" type="password" autocomplete="new-password" placeholder="推測されにくい長いパスワード"></label>
<label>確認用パスワード<input id="confirm" type="password" autocomplete="new-password"></label>
<button id="make">暗号化して content.enc.json を保存</button>
<p id="result" role="status"></p>
<p class="note">注意：ここで新しいデータを作ると、以前の暗号化ファイルと置き換わります。元写真は自分のPCに残し、パスワードも安全な場所に控えてください。短いパスワードは公開された暗号文から総当たりで破られる恐れがあります。</p>
<script>
const $=s=>document.getElementById(s); const enc=new TextEncoder();
function b64(data){let s='';const a=new Uint8Array(data);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);}
function loadImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めません: '+file.name))};img.src=url;});}
async function convert(file){const img=await loadImage(file);const factor=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*factor));canvas.height=Math.max(1,Math.round(img.naturalHeight*factor));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.78);}
$('make').onclick=async()=>{
const btn=$('make');if(!crypto.subtle){$('result').textContent='Web Cryptoが利用できません。Chrome/Edgeで開いてください。';return;}btn.disabled=true;$('result').textContent='暗号化しています…';
try{
const pwd=$('password').value;
if(!pwd||pwd!==$('confirm').value)throw new Error('パスワードが未入力か、一致しません');
if(pwd.length<12 && !confirm('短いパスワードは危険です。テスト専用として続けますか？'))throw new Error('キャンセルしました');
const files=[...$('photos').files];if(files.length>8)throw new Error('写真は最大8枚です');
const photos=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('対応していない画像: '+file.name);photos.push(await convert(file));}
const payload={title:$('title').value,message:$('message').value,photos};
const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iterations=310000;
const material=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt']);
const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(payload)));
const result={version:1,cipher:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations,salt:b64(salt),iv:b64(iv),data:b64(encrypted)};
const output=new Blob([JSON.stringify(result)],{type:'application/json'});const url=URL.createObjectURL(output);const a=document.createElement('a');a.href=url;a.download='content.enc.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
$('result').textContent='完成しました。content.enc.json だけをGitHubにアップロードしてください。';
}catch(ex){$('result').textContent='エラー：'+ex.message;}finally{btn.disabled=false;}
};
</script></body></html>
